[project]
name = "jepa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Josu Bernal", email = "josubernaldeuribarri@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.15.0",
    "x-transformers>=2.31.11",
]

[project.scripts]
jepa = "jepa:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
